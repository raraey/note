<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Note For You 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fff0f5 0%, #fdf5e6 100%);
    font-family: 'Quicksand', sans-serif;
    color: #5d4037;
    overflow: hidden;
  }

  .container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 15px 35px rgba(255, 182, 193, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.9);
    max-width: 400px;
    width: 85%;
    text-align: center;
    opacity: 0;
    transform: translateY(30px);
    animation: masukMulus 1.5s ease-out forwards;
  }

  @keyframes masukMulus {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .foto-wrapper {
    width: 180px;
    height: 180px;
    margin: 0 auto 25px auto;
    border-radius: 50%;
    padding: 8px;
    background: linear-gradient(45deg, #ffb6c1, #ffdab9);
    box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
    transition: transform 0.5s ease;
  }

  .foto-wrapper:hover {
    transform: scale(1.05) rotate(3deg);
  }

  .foto-wrapper img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    margin-top: 0;
    margin-bottom: 15px;
    color: #d81b60;
    font-style: italic;
  }

  #teks {
    font-size: 16px;
    line-height: 1.8;
    min-height: 80px;
    color: #795548;
    font-weight: 500;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: #d81b60;
    animation: blink 0.8s infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .heart {
    position: absolute;
    color: #ffb6c1;
    font-size: 20px;
    animation: melayang 4s linear infinite;
    bottom: -50px;
    z-index: -1;
    opacity: 0;
  }

  @keyframes melayang {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    20% { opacity: 0.8; }
    100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="foto-wrapper">
      <img src="kucing_lucu.jpg" alt="Foto Lucu">
    </div>

    <h1>For You 🌸</h1>
    <div id="teks">
      <span class="cursor"></span>
    </div>
  </div>

<script>
  function buatHati() {
    const hati = document.createElement('div');
    hati.classList.add('heart');
    const emojis = ['💖', '🌸', '✨', '🎀', '💌'];
    hati.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    
    hati.style.left = Math.random() * 100 + 'vw';
    hati.style.animationDuration = (Math.random() * 2 + 3) + 's';
    
    document.body.appendChild(hati);
    
    setTimeout(() => {
      hati.remove();
    }, 5000);
  }

  setInterval(buatHati, 500);

  const textElement = document.getElementById('teks');
  const pesan = "Hai! Aku cuma mau bilang kalau kamu itu berharga, hari ini, besok, dan seterusnya. Semangat ya! 𐔌՞ ܸ.ˬ.ܸ՞𐦯";
  let index = 0;

  function ketik() {
    if (index < pesan.length) {
      textElement.innerHTML = pesan.substring(0, index + 1) + '<span class="cursor"></span>';
      index++;
      setTimeout(ketik, 70); 
    }
  }

  setTimeout(ketik, 1500);
</script>
</body>
</html>
